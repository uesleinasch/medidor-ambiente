      </header>

      <main class="content">
        <section id="view-walls" class="view" aria-labelledby="nav-walls">
          <article class="ceiling-card">
            <div class="ceiling-head">
              <svg class="icon" aria-hidden="true"><use href="#i-height" /></svg>
              <span>Pé-direito</span>
            </div>
            <p id="ceiling-value" class="ceiling-value"></p>
            <p id="ceiling-support" class="ceiling-support"></p>
            <div class="button-row">
              <button id="ceiling-ar" class="btn filled" type="button" hidden>
                <svg class="icon" aria-hidden="true"><use href="#i-straighten" /></svg>Medir em AR
              </button>
              <button id="ceiling-edit" class="btn text" type="button">Digitar</button>
            </div>
          </article>

          <div id="ar-hint" class="banner info" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg>
            <p id="ar-hint-text"></p>
          </div>

          <div class="section-head">
            <h2>Paredes</h2>
            <span id="walls-count" class="badge"></span>
          </div>

          <ul id="wall-list" class="wall-list"></ul>

          <div id="walls-empty" class="empty-state" hidden>
            <div class="cookie"><svg class="icon" aria-hidden="true"><use href="#i-add-a-photo" /></svg></div>
            <h3>Fotografe a primeira parede</h3>
            <p>De frente, com os 4 cantos aparecendo. Depois siga pela sala sempre no mesmo sentido.</p>
            <div class="button-row center">
              <label class="btn filled">
                <svg class="icon" aria-hidden="true"><use href="#i-photo-camera" /></svg>Tirar foto
                <input type="file" accept="image/*" capture="environment" data-new-wall hidden />
              </label>
              <label class="btn outlined">
                <svg class="icon" aria-hidden="true"><use href="#i-image" /></svg>Galeria
                <input type="file" accept="image/*" data-new-wall hidden />
              </label>
            </div>
          </div>
        </section>

        <section id="view-plan" class="view" aria-labelledby="nav-plan" hidden></section>
        <section id="view-elevations" class="view" aria-labelledby="nav-elevations" hidden></section>
      </main>

      <label id="fab-new-wall" class="fab" aria-label="Nova parede: tirar foto">
        <svg class="icon" aria-hidden="true"><use href="#i-add-a-photo" /></svg>
        <span>Nova parede</span>
        <input type="file" accept="image/*" capture="environment" data-new-wall hidden />
      </label>

      <nav class="nav-bar" aria-label="Seções">
        <button id="nav-walls" type="button" data-view="walls" data-icon="photo-library">
          <span class="nav-indicator"><svg class="icon" aria-hidden="true"><use href="#i-photo-library-filled" /></svg></span>
          <span class="nav-label">Paredes</span>
        </button>
        <button id="nav-plan" type="button" data-view="plan" data-icon="architecture">
          <span class="nav-indicator"><svg class="icon" aria-hidden="true"><use href="#i-architecture" /></svg></span>
          <span class="nav-label">Planta</span>
        </button>
        <button id="nav-elevations" type="button" data-view="elevations" data-icon="view-carousel">
          <span class="nav-indicator"><svg class="icon" aria-hidden="true"><use href="#i-view-carousel" /></svg></span>
          <span class="nav-label">Vistas</span>
        </button>
      </nav>
    </div>

    <section id="editor" class="editor" hidden>
      <header class="editor-bar">
        <button id="editor-close" class="icon-btn" type="button" aria-label="Fechar">
          <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
        <button id="editor-title" class="editor-title" type="button" aria-label="Renomear parede">
          <span id="editor-name"></span>
          <svg class="icon small" aria-hidden="true"><use href="#i-edit" /></svg>
        </button>
        <button id="editor-save" class="btn filled small" type="button">Salvar</button>
      </header>

      <div class="editor-scroll">
        <div class="stepper">
          <div id="step-track" class="step-track"></div>
          <p id="step-label" class="step-label"></p>
        </div>

        <div class="photo-stage">
          <div id="marker-frame" class="marker-frame"><canvas id="marker"></canvas></div>
          <div id="photo-empty" class="photo-empty" hidden>
            <svg class="icon large" aria-hidden="true"><use href="#i-add-a-photo" /></svg>
            <p>Esta parede ainda não tem foto</p>
            <div class="button-row center">
              <label class="btn filled">
                Tirar foto
                <input type="file" accept="image/*" capture="environment" data-replace-photo hidden />
              </label>
              <label class="btn tonal">
                Galeria
                <input type="file" accept="image/*" data-replace-photo hidden />
              </label>
            </div>
          </div>
          <div class="stage-chips">
            <button id="scale-chip" class="stage-chip" type="button">
              <svg class="icon small" aria-hidden="true"><use href="#i-height" /></svg><span id="scale-chip-label"></span>
            </button>
            <button id="photo-chip" class="stage-chip icon-only" type="button" aria-label="Trocar foto">
              <svg class="icon small" aria-hidden="true"><use href="#i-photo-camera" /></svg>
            </button>
          </div>
        </div>

        <div class="instruction">
          <div class="instruction-text">
            <h3 id="instruction-title"></h3>
            <p id="instruction-text"></p>
          </div>
          <div id="corner-dots" class="corner-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>

        <div id="openings-panel" class="openings-panel" hidden>
          <div class="button-row">
            <button class="btn tonal" type="button" data-add-opening="door">
              <svg class="icon" aria-hidden="true"><use href="#i-door-front" /></svg>Porta
            </button>
            <button class="btn tonal" type="button" data-add-opening="window">
              <svg class="icon" aria-hidden="true"><use href="#i-window" /></svg>Janela
            </button>
          </div>
          <ul id="opening-list" class="chip-set"></ul>
        </div>

        <article class="result-card">
          <div class="result-values">
            <div>
              <span class="result-label">Largura</span>
              <strong id="result-width" class="result-number"></strong>
            </div>
            <div>
              <span class="result-label">Altura</span>
              <strong id="result-height" class="result-number"></strong>
            </div>
          </div>
          <p id="result-note" class="result-note"></p>
          <button id="adjust-open" class="btn text" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-tune" /></svg>Ajustar
          </button>
        </article>
      </div>

      <div class="floating-toolbar" role="toolbar" aria-label="Pontos">
        <button id="undo-point" class="icon-btn" type="button" aria-label="Desfazer ponto">
          <svg class="icon" aria-hidden="true"><use href="#i-undo" /></svg>
        </button>
        <button id="clear-points" class="icon-btn" type="button" aria-label="Apagar pontos">
          <svg class="icon" aria-hidden="true"><use href="#i-restart-alt" /></svg>
        </button>
        <button id="prev-step" class="btn text" type="button">Voltar</button>
        <button id="next-step" class="toolbar-fab" type="button"></button>
      </div>
    </section>

    <div id="snackbar" class="snackbar" role="status" aria-live="polite" hidden>
      <span id="snackbar-text"></span>
      <button id="snackbar-action" class="btn text inverse" type="button" hidden></button>
    </div>

    <div id="ar-overlay" class="ar-overlay" hidden>
      <canvas id="ar-canvas" class="ar-canvas"></canvas>
      <div class="ar-top">
        <button id="ar-close" class="ar-round" type="button" aria-label="Fechar">
          <svg class="icon" aria-hidden="true"><use href="#i-close" /></svg>
        </button>
        <div class="ar-modes" role="group" aria-label="Tipo de medida">
          <button id="ar-mode-distance" type="button">
            <svg class="icon small" aria-hidden="true"><use href="#i-straighten" /></svg>Distância
          </button>
          <button id="ar-mode-height" type="button">
            <svg class="icon small" aria-hidden="true"><use href="#i-height" /></svg>Altura
          </button>
        </div>
      </div>
      <div id="ar-guide" class="ar-guide">
        <svg class="icon" aria-hidden="true"><use href="#i-phone-android" /></svg>
      </div>
      <div id="ar-crosshair" class="ar-crosshair"></div>
      <div class="ar-bottom">
        <p id="ar-reading" class="ar-reading"></p>
        <p id="ar-message" class="ar-message"></p>
        <div class="ar-controls">
          <button id="ar-undo" class="ar-round" type="button" aria-label="Desfazer">
            <svg class="icon" aria-hidden="true"><use href="#i-undo" /></svg>
          </button>
          <button id="ar-action" class="ar-shutter" type="button" aria-label="Marcar ponto">
            <svg class="icon" aria-hidden="true"><use href="#i-add" /></svg>
          </button>
          <button id="ar-use" class="btn filled large" type="button" hidden></button>
          <span class="ar-spacer"></span>
        </div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
